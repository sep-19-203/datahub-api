# Cấu hình mặc định (an toàn). Secret/credential CHỈ qua biến môi trường / OpenShift Secret — không ghi vào file này.
server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  # Spring Boot 2.7: tên thuộc tính cũ của server.max-http-request-header-size (Spring Boot 3)
  max-http-header-size: 16KB
  tomcat:
    max-swallow-size: 1MB
    threads:
      max: 200

spring:
  application:
    name: hddt-data-api-service
  lifecycle:
    timeout-per-shutdown-phase: 60s
  main:
    banner-mode: off
  # Đường dẫn không có API ⇒ NoHandlerFoundException ⇒ envelope 404 (Spring 6.1 làm sẵn qua NoResourceFoundException).
  # Ứng dụng không phục vụ tài nguyên tĩnh; Swagger UI của springdoc tự đăng ký resource handler riêng.
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false
  jackson:
    time-zone: Asia/Ho_Chi_Minh
    default-property-inclusion: always
    deserialization:
      fail-on-unknown-properties: true
    generator:
      write-bigdecimal-as-plain: true
    serialization:
      write-dates-as-timestamps: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        readiness:
          include: readinessState,jobStore
        liveness:
          include: livenessState
  health:
    db:
      enabled: false
  metrics:
    tags:
      application: hddt-data-api-service

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    enabled: ${SWAGGER_UI_ENABLED:true}

hddt:
  api:
    max-months: 12
    tms-accepted-http-status: 200
    max-request-bytes: 65536
    max-active-jobs-per-client: 20
    max-active-jobs-per-mst: 3
  dse:
    # Kho metadata job (TD-API-03b). Biến môi trường cùng tên với ~/.config/hddt/dse-dev.env của toolkit.
    contact-points: ${DSE_CONTACT_POINTS:10.64.112.248:9042}
    local-datacenter: ${DSE_LOCAL_DC:DC_Ana}
    username: ${DSE_USERNAME:admin}
    password: ${DSE_PASSWORD:Hddt@2025}
    keyspace: ${DSE_JOB_KEYSPACE:datahub_hddt}
    # replication: mặc định {'class': 'NetworkTopologyStrategy', 'DC1': '2'}; ghi đè bằng biến HDDT_DSE_REPLICATION
    create-schema: ${DSE_CREATE_SCHEMA:false}
    job-ttl-seconds: 10368000
    active-shards: 8
  doris:
    jdbc-url: ${DORIS_JDBC_URL:jdbc:mysql://10.64.87.25:9030/?useSSL=false}
    username: ${DORIS_USERNAME:doris}
    password: ${DORIS_PASSWORD:Tct#$123}
    database: ${DORIS_DATABASE:datahub_hddt_v5}
    pool-size: ${DORIS_POOL_SIZE:20}
    sync-query-timeout-seconds: 30
    lookup-query-timeout-seconds: 600
    export-query-timeout-seconds: 7200
    # DB-P1-03 (TD-API-34): true ⇒ HD1/HD5/HD8/TMS đọc HD_MST_LIST DDL v5, không JOIN HOADON_HDR. Chỉ bật khi LIST là v5
    # và đối soát LIST ↔️ HDR của toolkit (LIST_CONTENT_VS_HDR) = 0 lệch.
    list-serving: ${DORIS_LIST_SERVING:false}
  s3:
    endpoint: ${S3_ENDPOINT:http://10.64.84.223:9020}
    region: ${S3_REGION:us-east-1}
    access-key: ${S3_ACCESS_KEY:1_hddt-uat_accid}
    secret-key: ${S3_SECRET_KEY:E0oxBNanPfDFuHqPMvzrZNKZZfXJ}
    path-style: true
    export-bucket: ${S3_EXPORT_BUCKET:hddt-doc-uat}
    export-prefix: export/query-result
    verify-result-prefix: export/hd8-result
    allowed-input-buckets: ${S3_ALLOWED_INPUT_BUCKETS:hddt-doc-uat}
    hd8-input-prefixes: import/tthc/,export/query-result/
    tms-input-prefixes: import/tms/
    doris-endpoint: ${S3_DORIS_ENDPOINT:}
    doris-access-key: ${S3_DORIS_ACCESS_KEY:}
    doris-secret-key: ${S3_DORIS_SECRET_KEY:}
  mst-status:
    # SI-24/SI-65: trạng thái MST HIỆN HÀNH (Hoàn thuế GTGT.xlsx F15) — ttmstnban (HD1), ttmstnmua (HD5), lọc lbttmsthue,
    # và HD3/HD8/TMS — từ view doris.NNT_ALL_STATUS (MV của NNT_HIS TD = '2100-01-01', sql/doris/04_nnt_all_status_mv.sql).
    # SQL PHẢI trả 3 cột (MST, MST_CU, TRANG_THAI): MST trên HĐ không thấy ở MST thì tra theo MST_CU (MST cũ của NNT).
    # Nguồn không có MST cũ: dùng NULL AS MST_CU.
    source-sql: ${MST_STATUS_SOURCE_SQL:SELECT MST, MST_CU, TRANG_THAI FROM doris.NNT_ALL_STATUS}
    excluded-codes: ["03", "05", "06"]
  hd1:
    # SI-46 (GiaiPhap v3.8 R1, slide v2.6 trang 27; người dùng chốt 02/11): chỉ HĐ mẫu 1 (GTGT), hoặc mẫu 5 có tiền thuế ≠ 0.
    form-rule-enabled: ${HD1_FORM_RULE_ENABLED:true}
    # SI-06 (HD1!AA35/AA36 "nếu số lượng hóa đơn ít <10k"; GiaiPhap v3.8 Bảng 2): kết quả < ngưỡng ⇒ POST chờ job xong
    # (tối đa realtime-wait) rồi trả HOAN_THANH kèm url, tsdong; quá hạn ⇒ trả trạng thái hiện tại. 0 = tắt.
    realtime-row-limit: 10000
    realtime-wait: PT20S
    realtime-poll-interval: PT0.5S
  hd5:
    # SI-47 (GiaiPhap v3.8 Bảng 5 R1 áp cho mọi danh sách; Bảng 2 HD5 "Như HD1"): chỉ HĐ mẫu 1, hoặc mẫu 5 có tiền thuế ≠ 0.
    form-rule-enabled: ${HD5_FORM_RULE_ENABLED:true}
    # SI-06 (HD5!AA35/AA36 "nếu số lượng hóa đơn ít <10k"): như hd1. 0 = tắt.
    realtime-row-limit: 10000
    realtime-wait: PT20S
    realtime-poll-interval: PT0.5S
  hd7:
    max-months: 12
    # 04/11 (SI-54, GiaiPhap v3.8 Bảng 5 R1): chỉ HĐ mẫu 1, hoặc mẫu 5 có tiền thuế ≠ 0 — cho cả mua vào và bán ra.
    form-rule-enabled: ${HD7_FORM_RULE_ENABLED:true}
    # 04/11 (SI-55, GiaiPhap v3.8 Bảng 6, Q4/Q4b): [23]/[24] chỉ 0%, 5%, 10% — không KCT, KKKNT, 8%, KHAC, CTTC.
    # Tính từ THTTLTSUAT / dòng hàng như bán ra (không dùng HD_MST_SUMMARY: không có mẫu số, thuế suất).
    mvao-tsuat: ["0%", "5%", "10%"]
    # Bán ra tính từ THTTLTSUAT (HĐ thiếu THTTLTSUAT ⇒ dòng hàng HOADON_DTL theo LTSUAT). Trường giá trị cộng thtien,
    # trường thuế cộng tthue của các mã tsuat được gán. [32b], [34a] chưa có mã ⇒ [] ⇒ trả null; KHAC/mã khác ⇒ bỏ qua
    # + cảnh báo. 04/11 (SI-56): 8% KHÔNG ánh xạ theo GiaiPhap v3.8 Q4 (chốt 26/10) — thay chốt 01/11 (SI-10);
    # muốn cộng 8% vào [32]/[33] thì đặt tgtbr10/tgttbr10: ["10%", "8%"].
    # 05/11 (SI-58): [34a] = mã KTPVDC (GiaiPhap v3.8 Bảng 6, danh mục QĐ 1233); [32b] không có trong v3.8 ⇒ null.
    bra-tsuat:
      tgtbr0: ["0%"]
      tgtbr5: ["5%"]
      tgttbr5: ["5%"]
      tgtbr10: ["10%"]
      tgttbr10: ["10%"]
      tgtbrkct: [kct]
      tgtbrkkknt: [kkknt]
      tgtbrktgtt: []
      tgtbrktpvdc: [ktpvdc]
    unassigned-tsuat-policy: IGNORE
    # 04/11 (SI-57, KI-API-24): HĐ không có THTTLTSUAT và không có dòng hàng có thuế suất ⇒ suy mức từ
    # TGTTHUE/TGTCTHUE header; sai số ≤ max(tolerance-vnd, |TGTCTHUE| × tolerance-ratio). [] = tắt. Không suy 0%.
    header-rate-inference: ["10%", "8%", "5%"]
    header-rate-tolerance-vnd: 1
    header-rate-tolerance-ratio: 0.0001
    # 05/11 (SI-59, GiaiPhap v3.8 R3/R4): NGAY_LAP = kỳ theo ngày lập, HĐ thay thế/điều chỉnh theo ngày lập HĐ gốc
    # (TDLHDGOC, cấp 1), cả bán ra và mua vào. KY_DANH_SACH = cột KY của HD_MST_LIST (mua vào NKY→NCMA→TDLAP như HD1).
    period-basis: ${HD7_PERIOD_BASIS:NGAY_LAP}
    # 05/11 (SI-60, v3.8 R7): nhân tỷ giá TGIA khi DVTTE ≠ VND và TGIA > 0.
    currency-conversion-enabled: ${HD7_CURRENCY_CONVERSION:true}
    # 05/11 (SI-61, v3.8 D3): HĐ điều chỉnh (TCHAT = 3) thiếu THTTLTSUAT đóng góp 0.
    adjustment-without-rates-zero: true
    # 06/11 (SI-62, v3.8 R6): HĐ thiếu THTTLTSUAT có 1 thuế suất dòng hàng ⇒ tổng dòng hàng (LINES); HEADER = lấy header.
    single-rate-source: ${HD7_SINGLE_RATE_SOURCE:LINES}
  hd8:
    # SI-12/SI-13 — người dùng chốt 31/10 + 01/11: file vào = CSV HD1 (từ 08/11: HD1 v3 15 cột, SI-65); khóa = khmshdon +
    # khhdon + shdon + nbmst; chỉ so tgtcthue (giá trị HHDV mua vào chưa thuế) và tgtthue (tiền thuế GTGT), khớp tuyệt đối;
    # file kết quả chỉ gồm dòng không hợp lệ (không tồn tại / sai khác / nhiều bản ghi), 21 cột v3: giá trị hệ thống song song
    # giá trị NNT gửi (*_nnt) — SI-65 (thay SI-14 "nguyên dòng đầu vào"). compare-fields không được chứa nky (đã gạch, file vào không có).
    rules-confirmed: true
    batch-size: 500
    max-rows: 1000000
    max-objects: 100
    max-total-bytes: 2147483648
    max-days: 366
    compare-fields: [tgtcthue, tgtthue]
    money-tolerance: 0
    # DB-P1-02 (TD-API-35): 1 truy vấn ứng viên HD_MST_LIST/job + tra theo khóa literal mỗi lô; false = cách cũ (dự phòng)
    candidate-index: ${HD8_CANDIDATE_INDEX:true}
    # chỉ dựng chỉ mục khi ứng viên của người mua ≤ số dòng file × giá trị này (file nhỏ / người mua rất lớn ⇒ cách cũ)
    index-max-candidates-per-key: 20
  tms:
    # SI-15 (01/11): LEDGER ⇒ kiểm tra đủ rồi ghi sổ hoàn Doris HD_SO_HOAN (sql/doris/02_hd_so_hoan.sql).
    # BLOCKED ⇒ kiểm tra xong, không ghi (job LOI); VALIDATE_ONLY chỉ cho DEV/TEST.
    apply-mode: LEDGER
    ledger-table: HD_SO_HOAN
    ledger-chunk-size: 1000
    batch-size: 500
    max-rows: 1000000
  export:
    engine: ${EXPORT_ENGINE:OUTFILE}
    max-file-bytes: 1073741824
    retention-days: 7
    parallel-outfile: false
    verify-record-count-max-bytes: 268435456
    success-file-name: _SUCCESS
  worker:
    enabled: ${WORKER_ENABLED:true}
    concurrency: ${WORKER_CONCURRENCY:4}
    lease: PT2M
    poll-interval: PT1S
    max-attempts: 3
    retry-backoff: PT30S
    max-retry-backoff: PT10M
    shutdown-grace: PT50S
    max-running-per-type:
      PURCHASE_LIST: 4
      SALES_LIST: 4
      PURCHASE_VERIFY: 2
      # Chạy tuần tự để kiểm tra "đã hoàn ở lần cập nhật khác" không bị hai job song song cùng vượt qua.
      REFUND_UPDATE: 1
  # TD-API-40 (09/11): KHÔNG còn X-Client-Id/X-Client-Secret — module chỉ được gọi nội bộ qua trục ESB.
  # Bên gọi xác định bằng header x-partner → partner-clients → clients (quyền, phạm vi MST, rate-limit).
  kafka:
    # Giá trị mặc định cho UAT internal (10/11/2026); môi trường khác ghi đè qua env.
    security-protocol: ${KAFKA_SECURITY_PROTOCOL:SASL_PLAINTEXT}
    sasl:
      mechanism: ${KAFKA_SASL_MECHANISM:SCRAM-SHA-256}
    internal:
      bootstrap-servers: ${KAFKA_INTERNAL_BOOTSTRAP_SERVERS:10.64.111.76:9093}
      sasl:
        # JAAS UAT trực tiếp như cấu hình realtime (Sếp chốt 10/11/2026).
        jaas-config: 'org.apache.kafka.common.security.scram.ScramLoginModule required  username="kafka-admin" password="hLKa5J@c12";'
      producer:
        max-request-size: 2000000

  job-result:
    enabled: ${JOB_RESULT_ENABLED:true}
    topic: datahub-job-result-out
    send-code: ${JOB_RESULT_SEND_CODE:HDDT}
    tthc-receipt-code: ${JOB_RESULT_TTHC_RECEIPT_CODE:TTHC}
    tms-receipt-code: ${JOB_RESULT_TMS_RECEIPT_CODE:TMS}
    client-id: tthc-hthue
    tms-client-id: tms-hthue
  security:
    gateway-token-header: ${APIC_GATEWAY_TOKEN_HEADER:}
    gateway-token-sha256: ${APIC_GATEWAY_TOKEN_SHA256:}
    # Chữ ký trục như HmacFilter của hddt-tthc-sharing: x-hmac = hex(HMAC-SHA256(khóa, "yyyyMMdd.<x-partner>")), ngày giờ VN.
    # Khóa đặt ngoài repo: ESB_HMAC_KEY, hoặc đúng tên của tthc-sharing tthc.hmac.key (biến TTHC_HMAC_KEY / -Dtthc.hmac.key).
    # Có khóa ⇒ mọi /hthue/** bắt buộc x-partner + x-hmac đúng (thiếu X-Request-Id ⇒ tự sinh).
    # Không khóa ⇒ KHÔNG xác thực (log WARN lúc khởi động); x-partner vẫn chọn quyền, không gửi ⇒ default-client.
    esb:
      hmac-key: ${ESB_HMAC_KEY:${tthc.hmac.key:}}
      partner-header: ${ESB_PARTNER_HEADER:x-partner}
      hmac-header: ${ESB_HMAC_HEADER:x-hmac}
      allowed-partners: ${ESB_ALLOWED_PARTNERS:}
      zone: Asia/Ho_Chi_Minh
      clock-skew: PT5M
    # x-partner (không phân biệt hoa thường) → client. Trục phải gửi TMS cho API cập nhật hoàn thuế (TTHC không có quyền đó).
    partner-clients:
      TTHC: tthc-hthue
      TMS: tms-hthue
    # Chỉ dùng khi KHÔNG có khóa ESB và request không gửi x-partner; để trống ⇒ thiếu x-partner bị 401.
    default-client: ${DEFAULT_CLIENT:noi-bo}
    clients:
      - id: tthc-hthue
        permissions: [PURCHASE_LIST, INVOICE_DETAIL, SALES_LIST, DECLARATION_SUGGEST, PURCHASE_VERIFY, JOB_READ]
        all-mst: true
        rate-per-second: 50
        burst: 100
      - id: tms-hthue
        permissions: [REFUND_UPDATE, JOB_READ]
        all-mst: true
        rate-per-second: 10
        burst: 20
      - id: noi-bo
        permissions: [PURCHASE_LIST, INVOICE_DETAIL, SALES_LIST, DECLARATION_SUGGEST, PURCHASE_VERIFY, REFUND_UPDATE, JOB_READ]
        all-mst: true
        rate-per-second: 50
        burst: 100
